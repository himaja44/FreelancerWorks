<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Job Details - Freelancer Works</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/jobs.css"
    >

    <link
        rel="stylesheet"
        href="css/job-details.css"
    >

</head>

<body>

<header class="jobs-navbar">

    <div class="dashboard-logo">
        Freelancer<span>Works</span>
    </div>

    <div class="jobs-nav-right">

        <a href="jobs.html">
            Find Jobs
        </a>

        <a href="dashboard.html">
            Dashboard
        </a>

        <button
            class="save-details-button"
            id="saveJobButton"
        >
            ♡ Save Job
        </button>

        <button
            class="apply-button"
            id="applyButton"
        >
            Apply Now
        </button>

        <span id="navUser">
            Loading...
        </span>

        <button id="logout"
        class="logout-button">
            Logout
        </button>

    </div>

</header>


<main class="job-details-page">

    <div id="jobDetails">

        <p class="loading-message">
            Loading job...
        </p>

    </div>

</main>


<script src="js/notifications.js"></script>
<script src="js/job-details.js"></script>

</html>
